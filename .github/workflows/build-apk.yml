
name: Build Truth Mode Shots APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Extract Android project
        run: |
          unzip -q truth-mode-shots-android-project.zip -d /tmp/truth-project
          cp -a /tmp/truth-project/truth-mode-shots/app .
          cp /tmp/truth-project/truth-mode-shots/settings.gradle.kts .
          cp /tmp/truth-project/truth-mode-shots/build.gradle.kts .
          cp /tmp/truth-project/truth-mode-shots/gradle.properties .

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Truth-Mode-Shots-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
